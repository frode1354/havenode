[project]
name = "crew-studio-backend"
version = "0.1.0"
description = "Local Crew Studio API with DeepSeek"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "crewai[tools]>=1.15.0",
  "selenium>=4.0.0",
  "webdriver-manager>=4.0.0",
  "pyyaml>=6.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
